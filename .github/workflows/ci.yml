name: Readiness validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run contract and readiness regression tests
        run: python -m unittest discover -s tests -v
      - name: Run offline hosted publisher regression tests
        run: python -m unittest discover -s scripts/foundry/tests -v

  maf-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Bicep only if the compiler prerequisite is missing
        run: |
          if ! python blueprints/maf/workflow/infra/validate.py --check-compiler; then
            az bicep install --version v0.49.2
          fi
      - name: Compile, lint, and validate configuration without Azure credentials
        run: python blueprints/maf/workflow/infra/validate.py
      - name: Run infrastructure security and configuration tests
        run: python -m unittest discover -s blueprints/maf/workflow/infra/tests -v

  maf-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv and locked blueprint dependencies
        working-directory: blueprints/maf/workflow/backend
        run: |
          wheel_dir="$RUNNER_TEMP/maf-framework-core"
          python scripts/verify_framework_supply_chain.py --output-dir "$wheel_dir"
          python -m pip install uv==0.9.26
          uv sync --locked
      - name: Check backend lint and formatting
        working-directory: blueprints/maf/workflow/backend
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run --rm -d --name maf-core-test \
            -e POSTGRES_USER=blueprint_test -e POSTGRES_DB=blueprint_test \
            -e "POSTGRES_PASSWORD=$password" -p 127.0.0.1:5432:5432 postgres:17-alpine
          echo "MAF_TEST_DATABASE_URL=postgresql://blueprint_test:$password@127.0.0.1:5432/blueprint_test" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if docker exec maf-core-test pg_isready -q -h 127.0.0.1 -U blueprint_test -d blueprint_test; then exit 0; fi
            sleep 1
          done
          echo "PostgreSQL TCP did not become ready" >&2
          exit 1
      - name: Run workflow, worker recovery, API security, and evidence tests
        working-directory: blueprints/maf/workflow/backend
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop maf-core-test || true

  maf-offline-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check fixed launcher boundary
        run: python -m unittest discover -s tests -p test_synthetic_manual_test.py -v
      - name: Check source runner against real Docker
        run: python -m unittest discover -s blueprints/maf/workflow/scripts/tests -v
      - name: Instantiate base and profile outside checkout
        run: |
          python scripts/instantiate_maf.py "$RUNNER_TEMP/offline-base"
          python scripts/instantiate_maf.py "$RUNNER_TEMP/offline-profile" --profile order-resolution
      - name: Check independently built runners without source checkout access
        working-directory: ${{ runner.temp }}
        run: |
          mv "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE.offline-hidden"
          trap 'mv "$GITHUB_WORKSPACE.offline-hidden" "$GITHUB_WORKSPACE"' EXIT
          for project in offline-base offline-profile; do
            cd "$RUNNER_TEMP/$project"
            python -m unittest discover -s scripts/tests -v
          done

  maf-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blueprints/maf/workflow/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run UI tests
        run: npm test
      - name: Build UI and verify its CSP
        run: npm run build && npm run check-csp

  maf-compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blueprints/maf/workflow
    env:
      ENTRA_TENANT_ID: 10000000-0000-4000-8000-000000000001
      ENTRA_API_CLIENT_ID: 20000000-0000-4000-8000-000000000002
      ENTRA_SPA_CLIENT_ID: 30000000-0000-4000-8000-000000000003
      ENTRA_API_APP_ID_URI: api://20000000-0000-4000-8000-000000000002
      BLUEPRINT_APPLICATION: examples.synthetic_application:build_application
      BLUEPRINT_PORT: "18080"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure isolated database password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build and start local stack
        run: |
          docker compose -p maf-app-ci build api
          docker compose -p maf-app-ci run --rm api python -m app.infrastructure.migrations upgrade
          docker compose -p maf-app-ci run --rm api python -m examples.synthetic_application
          docker compose -p maf-app-ci up --build --wait --wait-timeout 300
      - name: Verify HTTP boundaries and container permissions
        run: |
          curl_retry=(--retry 10 --retry-delay 1 --retry-all-errors --connect-timeout 5 --max-time 30)
          html="$(curl --fail --silent "${curl_retry[@]}" http://127.0.0.1:18080/)"
          asset="$(printf '%s' "$html" | grep -oE 'src="/assets/[^"]+\.js"' | cut -d '"' -f2)"
          test -n "$asset"
          bundle="$(curl --fail --silent "${curl_retry[@]}" "http://127.0.0.1:18080$asset")"
          for value in "$ENTRA_TENANT_ID" "$ENTRA_SPA_CLIENT_ID" "$ENTRA_API_APP_ID_URI"; do
            [[ "$bundle" == *"$value"* ]]
          done
          test "$(curl --silent "${curl_retry[@]}" --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/healthz)" = 204
          test "$(curl --silent "${curl_retry[@]}" --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/cases/40000000-0000-4000-8000-000000000004)" = 401
          curl --silent "${curl_retry[@]}" --head http://127.0.0.1:18080/ | grep -qi 'content-security-policy:'
          docker compose -p maf-app-ci exec -T api python -c "import os, stat; assert os.getuid() != 0; assert stat.S_IMODE(os.stat('/var/lib/blueprint/checkpoints').st_mode) == 0o700"
      - name: Remove isolated stack
        if: always()
        run: |
          if [ -n "${POSTGRES_PASSWORD:-}" ]; then
            docker compose -p maf-app-ci down --volumes --remove-orphans
          fi

  maf-independent:
    runs-on: ubuntu-latest
    env:
      ENTRA_TENANT_ID: 10000000-0000-4000-8000-000000000001
      ENTRA_API_CLIENT_ID: 20000000-0000-4000-8000-000000000002
      ENTRA_SPA_CLIENT_ID: 30000000-0000-4000-8000-000000000003
      ENTRA_API_APP_ID_URI: api://20000000-0000-4000-8000-000000000002
      BLUEPRINT_APPLICATION: examples.synthetic_application:build_application
      BLUEPRINT_PORT: "18080"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Instantiate outside the checkout
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          destination="$RUNNER_TEMP/maf-generated"
          order_resolution="$RUNNER_TEMP/maf-order-resolution-generated"
          python scripts/instantiate_maf.py "$destination"
          python scripts/instantiate_maf.py "$order_resolution" --profile order-resolution
          echo "GENERATED_DIR=$destination" >> "$GITHUB_ENV"
          echo "ORDER_RESOLUTION_DIR=$order_resolution" >> "$GITHUB_ENV"
      - name: Install generated project test dependencies
        run: |
          wheel_dir="$RUNNER_TEMP/maf-generated-framework-core"
          python "$GENERATED_DIR/backend/scripts/verify_framework_supply_chain.py" \
            --output-dir "$wheel_dir"
          python "$ORDER_RESOLUTION_DIR/backend/scripts/verify_framework_supply_chain.py" \
            --output-dir "$RUNNER_TEMP/maf-order-resolution-framework-core"
          python -m pip install uv==0.9.26
          uv sync --locked --project "$GENERATED_DIR/backend"
          uv sync --locked --project "$ORDER_RESOLUTION_DIR/backend"
          cd "$GENERATED_DIR/frontend"
          npm ci --no-audit --no-fund
          cd "$ORDER_RESOLUTION_DIR/frontend"
          npm ci --no-audit --no-fund
      - name: Validate generated infrastructure without Azure credentials
        run: |
          if ! python "$GENERATED_DIR/infra/validate.py" --check-compiler; then
            az bicep install --version v0.49.2
          fi
          python "$GENERATED_DIR/infra/validate.py"
          python -m unittest discover -s "$GENERATED_DIR/infra/tests" -v
      - name: Start isolated test PostgreSQL
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run --rm -d --name maf-instance-test \
            -e POSTGRES_USER=blueprint_test -e POSTGRES_DB=blueprint_test \
            -e "POSTGRES_PASSWORD=$password" -p 127.0.0.1:5432:5432 postgres:17-alpine
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "MAF_TEST_DATABASE_URL=postgresql://blueprint_test:$password@127.0.0.1:5432/blueprint_test" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if docker exec maf-instance-test pg_isready -q -h 127.0.0.1 -U blueprint_test -d blueprint_test; then exit 0; fi
            sleep 1
          done
          echo "PostgreSQL TCP did not become ready" >&2
          exit 1
      - name: Run generated backend and frontend tests
        run: |
          cd "$GENERATED_DIR/backend"
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked python -c "import app, pathlib; assert pathlib.Path(app.__file__).resolve().is_relative_to(pathlib.Path.cwd())"
          uv run --locked python -m unittest discover -s tests -v
          cd ../frontend
          npm test
          npm run build
          npm run check-csp
      - name: Run generated Order Resolution API, workflow, database, and UI tests
        run: |
          set -o pipefail
          cd "$ORDER_RESOLUTION_DIR/backend"
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked python -c "import app, pathlib; assert pathlib.Path(app.__file__).resolve().is_relative_to(pathlib.Path.cwd())"
          test -f "$ORDER_RESOLUTION_DIR/hosted-agent/src/order_resolution_hosted/application.py"
          ORDER_RESOLUTION_AGENT_A_SOURCE="$ORDER_RESOLUTION_DIR/hosted-agent/src" \
            uv run --locked python -m unittest discover -s tests -v
          cd ../hosted-agent
          uv pip install --python "$ORDER_RESOLUTION_DIR/backend/.venv/bin/python" \
            -r requirements.txt
          PYTHONPATH="$PWD/src:$ORDER_RESOLUTION_DIR/backend" \
            "$ORDER_RESOLUTION_DIR/backend/.venv/bin/python" \
            -m unittest discover -s tests -v
          cd ../frontend
          npm test
          npm run build
          npm run check-csp
          cd ../verification
          export ORDER_RESOLUTION_ADAPTER="$ORDER_RESOLUTION_DIR/backend/tests/order_resolution_adapter.py"
          uv run --locked --project ../backend python -m unittest -v \
            tests.test_order_resolution_contract 2>&1 | tee "$RUNNER_TEMP/order-resolution-contract.log"
          if grep -Eq 'skipped=|expected failures=' "$RUNNER_TEMP/order-resolution-contract.log"; then
            echo "Order Resolution verification must not skip canonical scenarios." >&2
            exit 1
          fi
      - name: Build and verify the generated hosted image without Azure
        run: |
          python "$ORDER_RESOLUTION_DIR/scripts/foundry/publish_order_resolution_hosted.py" \
            "$ORDER_RESOLUTION_DIR" --archive "$RUNNER_TEMP/hosted-source.zip" \
            --container-context "$RUNNER_TEMP/hosted-container"
          docker build --platform linux/amd64 --tag agent-blueprints-hosted:ci "$RUNNER_TEMP/hosted-container"
          docker run --rm --network none --entrypoint python agent-blueprints-hosted:ci -c '
          import os
          from unittest.mock import Mock, patch
          from agent_framework_foundry_hosting import ResponsesHostServer
          from order_resolution_hosted.host import create_responses_server
          app = Mock()
          app.checkpoint_types = ("app.order_resolution.workflow:OrderResolutionDecision",)
          with patch("order_resolution_hosted.host._configure_host_observability"):
              server = create_responses_server(app)
          assert isinstance(server, ResponsesHostServer)
          app.prewarm.assert_called_once()
          assert os.geteuid() != 0
          assert os.access(os.environ["HOME"], os.W_OK)
          '
      - name: Produce Order Resolution evaluation evidence and run independent validator
        run: |
          cd "$ORDER_RESOLUTION_DIR/backend"
          uv run --locked python -m tests.order_resolution_evidence_runner \
            --verification-root ../verification \
            --output ../verification/evidence/order-resolution \
            --revision "$SOURCE_REVISION" \
            --environment github-actions-generated-order-resolution
          cd ../verification
          set +e
          uv run --locked --project ../backend python -m readiness \
            --contract scenarios/order-resolution/verification-contract.json \
            --baseline scenarios/order-resolution/verification-contract.json \
            --input evidence/order-resolution/readiness-input.json \
            --trust scenarios/order-resolution/example-trust.json \
            --evidence-root evidence/order-resolution \
            --output evidence/order-resolution/readiness-report.json
          validator_status=$?
          set -e
          test "$validator_status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("evidence/order-resolution")
          matrix = json.loads((root / "readiness-matrix.json").read_text())
          report = json.loads((root / "readiness-report.json").read_text())
          inputs = json.loads((root / "readiness-input.json").read_text())
          assert matrix["local_factory_status"] == "passed"
          assert matrix["release_status"] == "blocked"
          assert set(matrix["scenario_results"].values()) == {"passed"}
          expected = {
              "ORDER-RESOLUTION-TECHNICAL-EXECUTION": "passed",
              "ORDER-RESOLUTION-BUSINESS-OUTCOME": "passed",
              "ORDER-RESOLUTION-MODEL-QUALITY": "unverified",
              "ORDER-RESOLUTION-BROWSER-EVIDENCE": "unverified",
              "ORDER-RESOLUTION-PROVENANCE": "unverified",
          }
          assert {item["check_id"]: item["outcome"] for item in inputs["results"]} == expected
          assert report["gate_status"] == "unverified"
          PY
      - name: Run generated contracts and golden acceptance without skips
        run: |
          set -o pipefail
          cd "$GENERATED_DIR/verification"
          export SCENARIO_ADAPTER="$GENERATED_DIR/backend/tests/order_adjustment_adapter.py"
          uv run --locked --project "$GENERATED_DIR/backend" python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/maf-verification-tests.log"
          if grep -Eq 'skipped=|expected failures=' "$RUNNER_TEMP/maf-verification-tests.log"; then
            echo "Generated verification must not skip acceptance checks." >&2
            exit 1
          fi
      - name: Run real evidence producer and independent validator
        run: |
          cd "$GENERATED_DIR/backend"
          set +e
          uv run --locked python -m tests.evidence_runner --verification-root ../verification \
            --output ../verification/evidence/run --revision "$SOURCE_REVISION" \
            --environment github-actions-generated
          runner_status=$?
          cd ../verification
          uv run --locked --project "$GENERATED_DIR/backend" python -m readiness --contract scenarios/order-adjustment/verification-contract.json \
            --baseline scenarios/order-adjustment/verification-contract.json \
            --input evidence/run/readiness-input.json --trust scenarios/order-adjustment/example-trust.json \
            --evidence-root evidence/run --output evidence/run/readiness-report.json
          validator_status=$?
          set -e
          test "$validator_status" -eq 1
          python -c "import json; r=json.load(open('evidence/run/readiness-report.json')); assert r['gate_status'] != 'passed'"
          if [ "$runner_status" -eq 0 ]; then
            python -c "import json; r=json.load(open('evidence/run/readiness-report.json')); assert r['gate_status'] == 'unverified'; i=json.load(open('evidence/run/readiness-input.json')); s={x['check_id']:x['outcome'] for x in i['results']}; assert s == {'CHECK-APPROVAL':'passed','CHECK-RECOVERY':'passed','CHECK-EXPLANATION':'unverified','CHECK-HINT':'unverified'}"
          fi
          exit "$runner_status"
      - name: Build and verify generated Compose stack
        run: |
          cd "$GENERATED_DIR"
          docker compose -p maf-generated-ci config --format json > "$RUNNER_TEMP/maf-compose.json"
          python -c "import json,os,pathlib; c=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'maf-compose.json'))); root=pathlib.Path(os.environ['GENERATED_DIR']).resolve(); assert all(pathlib.Path(s['build']['context']).resolve().is_relative_to(root) for s in c['services'].values() if 'build' in s); assert all(v.get('type') != 'bind' for s in c['services'].values() for v in s.get('volumes',[]))"
          docker compose -p maf-generated-ci build api
          docker compose -p maf-generated-ci run --rm api python -m app.infrastructure.migrations upgrade
          docker compose -p maf-generated-ci run --rm api python -m examples.synthetic_application
          docker compose -p maf-generated-ci up --build --wait --wait-timeout 300
          curl --fail --silent http://127.0.0.1:18080/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/healthz)" = 204
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/cases/40000000-0000-4000-8000-000000000004)" = 401
      - name: Build and verify generated Order Resolution Compose stack
        run: |
          cd "$ORDER_RESOLUTION_DIR"
          export BLUEPRINT_APPLICATION=app.order_resolution.application:build_application
          export BLUEPRINT_PORT=18081
          docker compose -p maf-order-resolution-ci config --format json > "$RUNNER_TEMP/maf-order-resolution-compose.json"
          python -c "import json,os,pathlib; c=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'maf-order-resolution-compose.json'))); root=pathlib.Path(os.environ['ORDER_RESOLUTION_DIR']).resolve(); assert all(pathlib.Path(s['build']['context']).resolve().is_relative_to(root) for s in c['services'].values() if 'build' in s); assert all(v.get('type') != 'bind' for s in c['services'].values() for v in s.get('volumes',[]))"
          docker compose -p maf-order-resolution-ci build api
          docker compose -p maf-order-resolution-ci run --rm api python -m app.order_resolution.migrations upgrade
          docker compose -p maf-order-resolution-ci up --build --wait --wait-timeout 300
          curl --fail --silent http://127.0.0.1:18081/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/healthz)" = 204
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/api/cases/40000000-0000-4000-8000-000000000004)" = 401
      - name: Retain synthetic run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maf-generated-evidence
          path: |
            ${{ runner.temp }}/maf-generated/verification/evidence/run
            ${{ runner.temp }}/maf-order-resolution-generated/verification/evidence/order-resolution
          if-no-files-found: warn
          retention-days: 7
      - name: Remove isolated services
        if: always()
        run: |
          if [ -d "${GENERATED_DIR:-}" ] && [ -n "${POSTGRES_PASSWORD:-}" ]; then
            cd "$GENERATED_DIR"
            docker compose -p maf-generated-ci down --volumes --remove-orphans
          fi
          if [ -d "${ORDER_RESOLUTION_DIR:-}" ] && [ -n "${POSTGRES_PASSWORD:-}" ]; then
            cd "$ORDER_RESOLUTION_DIR"
            BLUEPRINT_APPLICATION=app.order_resolution.application:build_application \
              BLUEPRINT_PORT=18081 \
              docker compose -p maf-order-resolution-ci down --volumes --remove-orphans
          fi
          if docker inspect maf-instance-test >/dev/null 2>&1; then
            docker stop maf-instance-test
          fi

  maf-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Instantiate an independent generated frontend
        run: |
          destination="$RUNNER_TEMP/maf-browser-generated"
          python scripts/instantiate_maf.py "$destination"
          echo "GENERATED_FRONTEND=$destination/frontend" >> "$GITHUB_ENV"
          profile_destination="$RUNNER_TEMP/maf-browser-order-resolution"
          python scripts/instantiate_maf.py "$profile_destination" --profile order-resolution
          echo "GENERATED_PROFILE_FRONTEND=$profile_destination/frontend" >> "$GITHUB_ENV"
      - name: Install locked browser dependencies and Chromium
        run: |
          cd "$GENERATED_FRONTEND"
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          cd "$GENERATED_PROFILE_FRONTEND"
          npm ci --no-audit --no-fund
      - name: Run actual local Chromium E2E
        run: |
          cd "$GENERATED_FRONTEND"
          npm run e2e:local
          npm run e2e:history
          npm run e2e:studio
          E2E_LIVE=true E2E_BASE_URL=https://app.example.test npx playwright test e2e/live-origin.spec.ts
          cd "$GENERATED_PROFILE_FRONTEND"
          npm run e2e:local
          npm run e2e:history
          npm run e2e:studio
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maf-generated-browser
          path: |
            ${{ runner.temp }}/maf-browser-generated/frontend/playwright-report
            ${{ runner.temp }}/maf-browser-generated/frontend/test-results
            ${{ runner.temp }}/maf-browser-generated/frontend/test-results-history
            ${{ runner.temp }}/maf-browser-generated/frontend/test-results-studio
            ${{ runner.temp }}/maf-browser-order-resolution/frontend/playwright-report
            ${{ runner.temp }}/maf-browser-order-resolution/frontend/test-results
            ${{ runner.temp }}/maf-browser-order-resolution/frontend/test-results-history
