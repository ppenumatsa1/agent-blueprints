[project]
name = "maf-workflow-blueprint"
version = "0.1.0"
description = "Independently owned MAF workflow blueprint"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "agent-framework-core==1.26.0",
    "azure-identity==1.27.0",
    "azure-monitor-opentelemetry-exporter==1.0.0b59",
    "fastapi==0.162.7",
    "httpx==0.28.1",
    "msal==1.39.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "psycopg[binary]==3.3.9",
    "PyJWT[crypto]==2.15.1",
    "SQLAlchemy==2.1.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "jsonschema==4.25.1",
    "rfc3339-validator==0.1.4",
    "ruff==0.14.13",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# The verifier loads this adapter by file path before backend imports are available.
"tests/order_adjustment_adapter.py" = ["E402"]
"tests/order_resolution_adapter.py" = ["E402"]
